<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar conta</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

    <main class="pagina">

        <div class="card">

            <div class="logo-area">
                <img
                    src="{{ url_for('logo') }}"
                    alt="Logo"
                    class="logo"
                >
            </div>

            <div class="cabecalho">
                <h1>Crie sua conta</h1>

                <p>
                    Informe seus dados para criar sua conta.
                </p>
            </div>

            <form action="{{ url_for('cadastro') }}" method="post">

                <div class="campo">
                    <label for="nome">Nome</label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Ex: Usuario da Silva"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="email">E-mail</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Ex: usuario123@gmail.com"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Ex: senha123"
                        required
                    >
                </div>

                <button type="submit" class="entrar">
                    Criar conta
                </button>

            </form>

            <div class="links">

                <p>
                    Já tem uma conta?
                    <a href="{{ url_for('login') }}">
                        Entrar
                    </a>
                </p>

                <a
                    href="{{ url_for('login') }}"
                    class="voltar"
                >
                    Voltar
                </a>

            </div>

        </div>

    </main>

</body>

</html>
